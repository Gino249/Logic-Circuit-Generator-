<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Logic Circuit Generator</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b2030;--mu:#5b6478;--bd:#d9deea;--ac:#2347d6;--on:#fff;--wire:#d62828;--gate:#2a3fd0;--hl:#e3f6e8;--hz:#fdebd3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131c;--card:#181c28;--tx:#e8ebf4;--mu:#9aa3b8;--bd:#2c3347;--ac:#8ea6ff;--on:#10131c;--wire:#ff6b6b;--gate:#8ea6ff;--hl:#1c3a29;--hz:#46331b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10131c;--card:#181c28;--tx:#e8ebf4;--mu:#9aa3b8;--bd:#2c3347;--ac:#8ea6ff;--on:#10131c;--wire:#ff6b6b;--gate:#8ea6ff;--hl:#1c3a29;--hz:#46331b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:18px 14px 60px}
h1{font-size:1.45rem;margin:.1em 0}.sub{color:var(--mu);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:16px 0}
label{display:block;font-size:.8rem;color:var(--mu);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.04em}
input,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.fn{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-family:ui-monospace,Consolas,monospace}.fn input{flex:1;min-width:140px}
.hint{font-size:.85rem;color:var(--mu);margin-top:4px}.err{color:#d62828;font-weight:600;margin-top:10px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--ac);background:var(--ac);color:var(--on);padding:9px 16px}
button.s{background:transparent;color:var(--ac);padding:5px 12px;font-size:.88rem}
.bar{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
h2{margin:0;font-size:1.15rem}.badge{background:var(--ac);color:var(--on);border-radius:99px;padding:2px 11px;margin-right:8px}
.given{font-family:ui-monospace,Consolas,monospace;color:var(--mu);font-size:.92rem;margin:4px 0 8px;overflow-wrap:anywhere}
.sec{border-top:1px solid var(--bd);margin-top:14px;padding-top:12px}
.sh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}.sh b{font-size:1rem}
.eq{font-family:ui-monospace,Consolas,monospace;overflow-x:auto;margin:6px 0}
.ov{display:inline-block;border-top:1.5px solid currentColor;padding-top:1px;line-height:1.15}
.sc{overflow-x:auto}table{border-collapse:collapse;margin:6px 14px 6px 0;display:inline-table;vertical-align:top}
.km td,.km th{border:1px solid var(--bd);min-width:46px;height:46px;text-align:center;position:relative;padding:2px}
.km th{background:var(--bg);font-family:ui-monospace,Consolas,monospace;font-size:.85rem;min-width:46px;height:30px}
.km td b{font-size:1.1rem}.km td small{position:absolute;left:3px;top:1px;font-size:.62rem;color:var(--mu)}
.km td.one{background:var(--hl)}.km td span{position:absolute;left:2px;right:2px;bottom:2px;display:flex;gap:2px;justify-content:center}
i.c{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
.km td i.c{margin:0}.lg{list-style:none;padding:0;margin:8px 0;font-family:ui-monospace,Consolas,monospace;font-size:.88rem}
.tt td,.tt th{border:1px solid var(--bd);padding:4px 12px;text-align:center;font-family:ui-monospace,Consolas,monospace}.tt th{background:var(--bg)}
.tt tr.h td{background:var(--hl)}.tt tr.z td{background:var(--hz)}
svg{display:block;height:auto}svg .w{stroke:var(--wire);stroke-width:1.8;fill:none}svg .d{fill:var(--wire)}
svg .g{stroke:var(--gate);stroke-width:2;fill:var(--bg)}svg text{fill:var(--tx);font:12px ui-monospace,Consolas,monospace}
svg .ic{fill:var(--gate);font-size:11px}svg .o{font-weight:700;font-size:14px}
#md{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:14px;z-index:9}
#md.on{display:flex}.bx{background:var(--card);border:1px solid var(--bd);border-radius:14px;width:min(680px,100%);max-height:calc(100% - 20px);overflow:auto;padding:18px 20px}
.bx h3{margin:0 0 8px;font-size:1.15rem}.bx ol{padding-left:22px;margin:8px 0}.bx li{margin:0 0 12px;line-height:1.55;overflow-wrap:anywhere}
.mono{font-family:ui-monospace,Consolas,monospace}
.alt{margin:12px 0;padding:6px 12px 12px;border:1px dashed var(--bd);border-radius:10px}.alt .fn{margin-top:2px}.okm{color:#2b9348;font-weight:700;margin:10px 0 4px}.alt .err{margin-top:8px}
</style></head><body><main>
<h1>Logic Circuit Generator</h1>
<p class="sub">Enter a function or Boolean expression, choose what to generate, and get a K-map, truth table and logic circuit, each with a step-by-step explanation.</p>
<section class="card">
<label for="mode">1. Input type</label>
<select id="mode"><option value="f">Function: F(variables) = Σ(minterms)</option><option value="e">Boolean expression</option></select>
<label for="vars">2. Enter variables (2 to 5, single letters)</label>
<input id="vars" placeholder="x, y, z" autocomplete="off"><div class="hint" id="vc">Total variables: 0</div>
<label for="val" id="vl">3. Minterms</label>
<div class="fn"><span id="pre">F(…) = Σ(</span><input id="val" autocomplete="off" placeholder="1, 2, 3, 6, 7"><span id="suf">)</span></div>
<div class="hint" id="vh"></div>
<label for="kind">4. What to generate</label>
<select id="kind"><option value="nand">Universal NAND (minterms, NAND-NAND)</option><option value="nor">Universal NOR (maxterms, NOR-NOR)</option><option value="ao">Fundamental gates: AND-OR-NOT (SOP)</option><option value="oa">Fundamental gates: OR-AND-NOT (POS)</option></select>
<div class="bar"><button id="go">Generate</button><button class="s" id="clr">Clear all</button></div>
<div class="err" id="er" role="alert"></div>
</section>
<div id="out"></div>
<div id="md" role="dialog" aria-modal="true"><div class="bx"><h3 id="mt"></h3><div id="mb"></div><div class="bar"><button id="mx">Close</button></div></div></div>
<script>
const $=i=>document.getElementById(i),gens=[];let N=0;
const COL=["#e63946","#2a9d8f","#e9a100","#6a4cff","#2b9348","#d6409f","#0096c7","#8d5a2b"];
const KT={nand:{a:"nand",b:"nand",bp:1,sop:1,name:"Universal NAND"},nor:{a:"nor",b:"nor",bp:1,sop:0,name:"Universal NOR"},ao:{a:"and",b:"or",bp:0,sop:1,name:"AND-OR-NOT"},oa:{a:"or",b:"and",bp:0,sop:0,name:"OR-AND-NOT"}};
const ICs={nand:{1:"7400N",2:"7400N",3:"7410N",4:"7420N"},nor:{1:"7402N",2:"7402N",3:"7427N",4:"7425N",5:"74260N"},and:{2:"7408N",3:"7411N",4:"7421N"},or:{2:"7432N"},not:{1:"7404N"}};
const ic=(t,n)=>(ICs[t]&&ICs[t][n])||`${t.toUpperCase()}-${n}`;
const cmp=l=>l.endsWith("'")?l[0]:l+"'",ov=h=>`<span class="ov">${h}</span>`,esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const pc=x=>{let c=0;while(x){c+=x&1;x>>=1}return c};
function getVars(){const t=$("vars").value.split(/[\s,]+/).filter(Boolean);
 if(t.some(v=>!/^[A-Za-z]$/.test(v)))return{e:"Each variable must be a single letter, for example: x, y, z."};
 if(new Set(t).size!=t.length)return{e:"Variable names must be different."};
 if(t.length<2||t.length>5)return{e:"Please enter between 2 and 5 variables."};return{v:t}}
function ui(){const r=getVars(),e=$("mode").value=="e";
 $("vc").textContent=r.v?`Total variables: ${r.v.length}  (${2**r.v.length} truth-table rows)`:"Total variables: "+($("vars").value.trim()?"?":"0");
 const n=r.v?r.v.join(", "):"…";$("vl").textContent=e?"3. Boolean expression":"3. Minterms";
 $("pre").textContent=e?`F(${n}) =`:`F(${n}) = Σ(`;$("suf").textContent=e?"":")";
 $("val").placeholder=e?"x'y + yz + xz'":"1, 2, 3, 6, 7";
 $("vh").textContent=e?"Use ' or ! for NOT, + for OR, * or nothing for AND, and parentheses. Example: A'B + (B+C)'":"Numbers separated by commas. The first variable is the most significant bit."}
function parseExpr(s,vars){s=s.replace(/^[^=]*=/,"").replace(/\s+/g,"");
 const t=s.match(/[A-Za-z01]|[()'!~+*.&|]/g)||[];if(!t.length||t.join("")!=s)throw Error("The expression is empty or has an unsupported character.");
 let i=0;const st=x=>x&&/[A-Za-z01(!~]/.test(x);
 const or=()=>{let a=and();while(t[i]=="+"||t[i]=="|"){i++;const b=and(),p=a;a=e=>p(e)|b(e)}return a};
 const and=()=>{let a=un();while(t[i]=="*"||t[i]=="."||t[i]=="&"||st(t[i])){if("*.&".includes(t[i]))i++;const b=un(),p=a;a=e=>p(e)&b(e)}return a};
 const un=()=>{if(t[i]=="!"||t[i]=="~"){i++;const a=un();return e=>1-a(e)}let a=at();while(t[i]=="'"){i++;const p=a;a=e=>1-p(e)}return a};
 const at=()=>{const x=t[i++];if(x=="("){const a=or();if(t[i++]!=")")throw Error("A closing parenthesis is missing.");return a}
  if(x=="0"||x=="1")return()=>+x;if(x&&/[A-Za-z]/.test(x)){if(!vars.includes(x))throw Error(`Variable ${x} is not in your variable list.`);return e=>e[x]}
  throw Error("The expression ends unexpectedly or has a misplaced symbol.")};
 const f=or();if(i<t.length)throw Error("Could not read the expression near “"+t[i]+"”.");return f}
function qm(on){let cur=[...new Set(on)].map(v=>({v,k:0})),pr=[];
 while(cur.length){const u=new Set(),nx=new Map();
  cur.forEach((x,a)=>cur.forEach((y,b)=>{if(b>a&&x.k==y.k){const d=x.v^y.v;if(d&&!(d&(d-1))){u.add(a);u.add(b);const o={v:x.v&~d,k:x.k|d};nx.set(o.v+","+o.k,o)}}}));
  cur.forEach((x,a)=>{if(!u.has(a))pr.push(x)});cur=[...nx.values()]}
 return pr}
function cover(pr,on,n){const cv=pr.map(p=>on.filter(m=>(m&~p.k)==p.v)),lit=i=>n-pc(pr[i].k),ch=new Set();
 on.forEach(m=>{const c=pr.map((p,i)=>i).filter(i=>cv[i].includes(m));if(c.length==1)ch.add(c[0])});
 let best=null;const cost=s=>[...s].reduce((a,i)=>a+lit(i),0);
 (function go(s){if(best&&s.size>best.size)return;const u=on.find(m=>![...s].some(i=>cv[i].includes(m)));
  if(u===undefined){if(!best||s.size<best.size||(s.size==best.size&&cost(s)<cost(best)))best=new Set(s);return}
  pr.forEach((p,i)=>{if(cv[i].includes(u)){const t=new Set(s);t.add(i);go(t)}})})(ch);
 return[...best].map(i=>({...pr[i],cov:cv[i]}))}
const toLits=(p,n,vars,sop)=>{const r=[];for(let i=0;i<n;i++){const b=n-1-i;if(p.k>>b&1)continue;const one=p.v>>b&1;r.push(vars[i]+((sop?!one:one)?"'":""))}return r};
const termStr=(l,sop)=>sop?l.join(""):l.join("+");
const kind2=g=>KT[g.kind];

/* ---------- circuit drawing ---------- */
function gate(t,n,x,y){const h=Math.max(28,n*14),nd=t=="nand"||t=="and",bub=t=="nand"||t=="nor"||t=="not";
 const d=t=="not"?`M0,${-h/2}L36,0L0,${h/2}Z`:nd?`M0,${-h/2}H16A20,${h/2} 0 0 1 16,${h/2}H0Z`:`M0,${-h/2}Q22,${-h/2} 36,0Q22,${h/2} 0,${h/2}Q10,0 0,${-h/2}Z`;
 return `<g transform="translate(${x},${y})"><path class="g" d="${d}"/>${bub?'<circle class="g" cx="40" cy="0" r="4"/>':'<path class="w" d="M36,0H44"/>'}</g><text class="ic" x="${x+22}" y="${y+h/2+14}" text-anchor="middle">${ic(t,n)}</text>`}
function inv(t,cx,cy){const nd=t=="nand",d=t=="not"?"M0,-12L36,0L0,12Z":nd?"M0,-12H16A20,12 0 0 1 16,12H0Z":"M0,-12Q22,-12 36,0Q22,12 0,12Q10,0 0,-12Z";
 const w=t=="not"?"M-14,0H0":"M-14,0H-8M-8,-6V6M-8,-6H6M-8,6H6";
 return `<g transform="translate(${cx},${cy}) rotate(90)"><path class="w" d="${w}"/><path class="g" d="${d}"/><circle class="g" cx="40" cy="0" r="4"/></g><text class="ic" x="${cx+16}" y="${cy+22}">${ic(t=="not"?"not":t,t=="not"?1:2)}</text>`}
function circuit(g){const k=kind2(g),vars=g.vars,items=g.groups.map(q=>q.lits),sop=k.sop,type=g.kind;
 const invT=k.bp?k.a:"not",first=k.a,outT=k.b;
 const used=new Set();items.forEach(it=>it.length==1?used.add(k.bp?cmp(it[0]):it[0]):it.forEach(l=>used.add(l)));
 const T={},C={};let x=44;
 for(const v of vars){const nc=used.has(v+"'");if(!used.has(v)&&!nc)continue;T[v]=x;if(nc){C[v]=x+26;x+=64}else x+=38}
 const rx=q=>q.endsWith("'")?C[q[0]]:T[q[0]],cy=80,X1=x+16;let y=190;
 const rows=items.map(it=>{const n=it.length,h=n>1?Math.max(28,n*14):0,r={it,n,gy:y+h/2+(n>1?0:6)};y+=n>1?h+26:38;return r});
 const m=rows.length,gyO=rows.reduce((a,r)=>a+r.gy,0)/m,hO=Math.max(28,m*14),skip=!k.bp&&m==1,bottom=y;
 const X2=X1+44+110+m*10+20;let w="",gs="";
 rows.forEach((r,i)=>{const xm=X1+44+100+Math.round(Math.abs(i-(m-1)/2)*10),pin=gyO+(i-(m-1)/2)*14,tx=skip?X2+96:X2+6;
  if(r.n>1){r.it.forEach((l,j)=>{const py=r.gy+(j-(r.n-1)/2)*14,X=rx(l);w+=`<path class="w" d="M${X},${py}H${X1+6}"/><circle class="d" cx="${X}" cy="${py}" r="3"/>`});
   gs+=gate(first,r.n,X1,r.gy);const e=termStr(r.it,sop);w+=`<path class="w" d="M${X1+44},${r.gy}H${xm}V${pin}H${tx}"/>`;
   gs+=`<text x="${X1+50}" y="${r.gy-6}">${k.bp?"("+e+")'":e}</text>`}
  else{const q=k.bp?cmp(r.it[0]):r.it[0],X=rx(q);w+=`<path class="w" d="M${X},${r.gy}H${xm}V${pin}H${tx}"/><circle class="d" cx="${X}" cy="${r.gy}" r="3"/>`;gs+=`<text x="${X1-2}" y="${r.gy-6}">${q}</text>`}});
 if(!skip){gs+=gate(outT,m,X2,gyO);w+=`<path class="w" d="M${X2+44},${gyO}H${X2+96}"/>`}
 const H=Math.max(bottom,gyO+hO/2)+36,W=X2+140;let rl="",tp="";
 for(const v of vars){if(T[v]==null)continue;tp+=`<text x="${T[v]-4}" y="20" font-weight="700">${v}</text>`;rl+=`<path class="w" d="M${T[v]},28V${bottom-12}"/>`;
  if(C[v]){rl+=`<path class="w" d="M${T[v]},${cy-14}H${C[v]}"/><circle class="d" cx="${T[v]}" cy="${cy-14}" r="3"/><path class="w" d="M${C[v]},${cy+44}V${bottom-12}"/>`;tp+=inv(invT,C[v],cy)+`<text x="${C[v]+6}" y="${cy+66}">${v}'</text>`}}
 return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Logic circuit">${rl}${w}${tp}${gs}<text class="o" x="${X2+102}" y="${gyO+5}">F</text></svg>`}

/* ---------- K-map and truth table ---------- */
function kmap(g){const {n,vars}=g,cb=n==2?1:2,rb=n==5?2:n-cb,gray=c=>c==1?[0,1]:[0,1,3,2],b=(v,l)=>v.toString(2).padStart(l,"0"),base=n==5?1:0;
 const rv=vars.slice(base,base+rb),cv=vars.slice(base+rb);
 const pan=(n==5?[0,1]:[null]).map(a=>{let h=`<table class="km">${a!==null?`<caption>${vars[0]} = ${a}</caption>`:""}<tr><th>${rv.join("")}\\${cv.join("")}</th>${gray(cb).map(c=>`<th>${b(c,cb)}</th>`).join("")}</tr>`;
  gray(rb).forEach(r=>{h+=`<tr><th>${b(r,rb)}</th>`;gray(cb).forEach(c=>{const m=((a||0)<<(n-1))|(r<<cb)|c,v=g.f[m];
   h+=`<td class="${v?"one":""}"><small>${m}</small><b>${v}</b><span>${g.groups.map((q,i)=>q.cov.includes(m)?`<i class="c" style="background:${COL[i%8]}"></i>`:"").join("")}</span></td>`});h+="</tr>"});return h+"</table>"}).join("");
 const lg=g.groups.map((q,i)=>`<li><i class="c" style="background:${COL[i%8]}"></i>Group ${i+1}: ${g.sop?"":"F′ term "}<b>${g.sop?termStr(q.lits,1):toLits(q,n,vars,1).join("")}</b> covers cells ${q.cov.join(", ")}${g.sop?"":" → factor ("+termStr(q.lits,0)+")"}</li>`).join("");
 return `<div class="sc">${pan}</div><ul class="lg">${lg||"<li>Constant function: no groups needed.</li>"}</ul>`}
function ttable(g){const {n,vars}=g;let h=`<table class="tt"><tr><th>#</th>${vars.map(v=>`<th>${v}</th>`).join("")}<th>F</th></tr>`;
 for(let m=0;m<2**n;m++){const cl=g.f[m]==(g.sop?1:0)?(g.sop?"h":"z"):"";h+=`<tr class="${cl}"><td>${m}</td>${vars.map((v,i)=>`<td>${m>>(n-1-i)&1}</td>`).join("")}<td><b>${g.f[m]}</b></td></tr>`}return h+"</table>"}

/* ---------- explanations ---------- */
const stays=(p,n,vars)=>vars.map((v,i)=>p.k>>(n-1-i)&1?`${v} changes`:`${v} stays ${p.v>>(n-1-i)&1}`).join(", ");
function exKmap(g){const {n,vars,sop}=g,S=sop?1:0,L=[];
 L.push(`Your function has <b>${n} variables</b> (${vars.join(", ")}), so the map has 2<sup>${n}</sup> = <b>${2**n} cells</b>, one for every row of the truth table.${n==5?" With 5 variables the map is drawn as two 4-variable maps, one for "+vars[0]+" = 0 and one for "+vars[0]+" = 1.":""}`);
 L.push(`Each cell number is the binary value of the variables (${vars.join("")}), where ${vars[0]} is the most significant bit. The row and column labels use <b>Gray code</b> (00, 01, 11, 10), so neighbouring cells, even cells on opposite edges, differ in exactly one variable. That is why they can be merged.`);
 L.push(`Write F in every cell: <b>1</b> in cells ${g.ones.join(", ")||"(none)"} and <b>0</b> in the remaining cells.`);
 if(g.const!==undefined){L.push(`Every cell is ${g.const}, so F is the constant <b>${g.const}</b> and nothing needs to be grouped.`);return L}
 L.push(`You chose ${kind2(g).name}, so group the <b>${S}s</b> (${sop?"minterms":"maxterms"}). Make rectangles of 1, 2, 4, 8 or 16 cells (powers of two), as large as possible, covering every ${S} at least once, with as few groups as possible. Groups may overlap and may wrap around the edges.`);
 g.groups.forEach((q,i)=>{const pr=toLits(q,n,vars,1).join(""),su=termStr(q.lits,0);
  L.push(sop?`<span style="color:${COL[i%8]}"><b>Group ${i+1}</b></span> covers cells ${q.cov.join(", ")} (${q.cov.length} cells). Inside it: ${stays(q,n,vars)}. A variable that stays 1 is written as itself, one that stays 0 is written complemented, and a variable that changes drops out. Product term: <b class="mono">${pr}</b>.`
  :`<span style="color:${COL[i%8]}"><b>Group ${i+1}</b></span> covers the 0 cells ${q.cov.join(", ")} (${q.cov.length} cells). Inside it: ${stays(q,n,vars)}. Read as a product it gives F′ = <span class="mono">${pr}</span>. Complementing with De Morgan’s law turns it into the sum factor <b class="mono">(${su})</b>.`)});
 L.push(sop?`Add all product terms: <b class="mono">F = ${g.sopS}</b>.`:`F′ is the sum of the group products, so F is the product of the factors: <b class="mono">F = ${g.posS}</b>.`);return L}
function exTT(g){const {n,vars}=g,L=[];
 L.push(`There are ${n} variables, so the table has 2<sup>${n}</sup> = <b>${2**n} rows</b> (numbered 0 to ${2**n-1}).`);
 L.push(`The variable columns simply count in binary from ${"0".repeat(n)} to ${"1".repeat(n)}. ${vars[0]} is the leftmost, most significant bit, and ${vars[n-1]} changes every row.`);
 L.push(g.mode=="f"?`The F column is <b>1</b> for the minterms you listed (${g.ones.join(", ")||"none"}) and <b>0</b> for every other row.`:`For each row, substitute that row’s values of ${vars.join(", ")} into your expression and evaluate it with the rules NOT first, then AND, then OR. The result goes in the F column. Example: row 0 sets every variable to 0, row ${2**n-1} sets every variable to 1.`);
 L.push(`Rows where F = 1 are the <b>minterms</b>: <span class="mono">F = Σ m(${g.ones.join(", ")||"none"})</span>. Rows where F = 0 are the <b>maxterms</b>: <span class="mono">F = Π M(${g.zeros.join(", ")||"none"})</span>.`);
 L.push(`Highlighted rows show what your choice uses: ${g.sop?"the green rows (F = 1) because "+kind2(g).name+" works from minterms.":"the orange rows (F = 0) because "+kind2(g).name+" works from maxterms."}`);return L}
function exCkt(g){const k=kind2(g),{vars,sop,groups:G}=g,L=[],m=G.length;if(g.const!==undefined)return[`F is the constant ${g.const}, so no gates are needed. Connect the output directly to ${g.const?"+Vcc (logic 1)":"ground (logic 0)"}.`];
 const items=G.map(q=>q.lits),ts=items.map(l=>termStr(l,sop)),comps=vars.filter(v=>items.some(l=>l.some(x=>x==v+"'"||(k.bp&&l.length==1&&x==v))));
 L.push(`Start from the minimized ${sop?"SOP":"POS"} found with the K-map: <b class="mono">F = ${sop?g.sopS:g.posS}</b>.`);
 L.push({nand:`<b>NAND-NAND:</b> complement twice and apply De Morgan’s law: F = ((${ts.join("+")})′)′ = <b class="mono">(${ts.map(t=>"("+t+")′").join("·")})′</b>. So every product term is NANDed first, and the results are NANDed together.`,
  nor:`<b>NOR-NOR:</b> complement twice and apply De Morgan’s law: F = ${ts.map(t=>"("+t+")").join("")} = <b class="mono">(${ts.map(t=>"("+t+")′").join("+")})′</b>. So every sum term is NORed first, and the results are NORed together.`,
  ao:`<b>AND-OR:</b> each product term is made by an AND gate, then one OR gate adds all the products. NOT gates make the complemented inputs.`,
  oa:`<b>OR-AND:</b> each sum term is made by an OR gate, then one AND gate multiplies all the sums. NOT gates make the complemented inputs.`}[g.kind]);
 L.push(`<b>Inputs:</b> each variable has a vertical red rail. A dot means a wire is connected; a wire crossing a rail without a dot is not connected. ${comps.length?`Complements ${comps.map(v=>v+"′").join(", ")} are made by an inverter (${k.bp?"a "+ic(k.a,2)+" gate with its two inputs tied together":"a "+ic("not",1)+" NOT gate"}) fed from the rail of the same variable.`:"No complemented inputs are needed."}`);
 items.forEach((l,i)=>L.push(l.length>1?`<b>First level, gate ${i+1}:</b> a ${l.length}-input ${first(k)} gate (${ic(k.a,l.length)}) takes ${l.join(", ")}. Its output is <span class="mono">${k.bp?"("+ts[i]+")′":ts[i]}</span>, printed above its wire.`:`<b>First level, term ${i+1}:</b> only one literal (${l[0]}), so no gate is needed. ${k.bp?"A first-level gate would only be an inverter, so the complement "+cmp(l[0])+" is wired straight to the output gate instead.":l[0]+" goes straight to the output gate."}`));
 L.push(g.groups.length==1&&!k.bp?`There is only one term, so its wire is the output F and no second-level gate is needed.`:`<b>Output gate:</b> one ${m}-input ${k.b.toUpperCase()} gate (${ic(k.b,m)}) combines the ${m} first-level wires and produces <b>F</b>.`);
 const ng=items.filter(l=>l.length>1).length+((!k.bp&&m==1)?0:1);L.push(`<b>Gate count:</b> ${ng} logic gate${ng>1?"s":""} + ${comps.length} inverter${comps.length==1?"":"s"}. Chips are labelled under each gate (for example ${ic(k.a,2)}).`);return L}
const first=k=>k.a.toUpperCase();
function open(i,w){const g=gens[i],T={k:"K-map",t:"Truth table",c:"Logic circuit"}[w],L={k:exKmap,t:exTT,c:exCkt}[w](g);
 $("mt").textContent=`Generation #${g.id}: ${T} explained`;$("mb").innerHTML="<ol>"+L.map(x=>`<li>${x}</li>`).join("")+"</ol>";$("md").classList.add("on");$("md").querySelector(".bx").scrollTop=0}
const close=()=>$("md").classList.remove("on");

/* ---------- different answer ---------- */
function altBox(g,i){const sop=g.sop,a=g.vars[0],b=g.vars[1],c=g.vars[2]||a;
 return `<div class="alt"><label for="a${i}">Enter different answer:</label><div class="fn"><span>F =</span><input id="a${i}" data-a="${i}" autocomplete="off" placeholder="${sop?`${a}'${b} + ${b}${c}`:`(${a}+${b})(${b}'+${c})`}"><button class="s" data-chk="${i}">Check</button></div><div class="hint">Type an equivalent ${sop?"sum of products (SOP) such as "+a+"'"+b+" + "+b+c:"product of sums (POS) such as ("+a+"+"+b+")("+b+"'+"+c+")"}. If it is correct, a new circuit is generated from your answer.</div><div id="r${i}"></div></div>`}
function parseAlt(s,vars,sop){s=s.replace(/^[^=]*=/,"").replace(/\s+/g,"");if(!s)throw Error("Type your answer first.");
 const L=x=>{const t=x.replace(/[*.]/g,""),l=t.match(/[A-Za-z]'?/g)||[];if(!l.length||l.join("")!=t)throw Error(`I could not read “${x}”. Use letters, ' for NOT${sop?"":", and + inside parentheses"}.`);
  l.forEach(q=>{if(!vars.includes(q[0]))throw Error(`Variable ${q[0]} is not in your variable list.`)});return l};
 let items;
 if(sop){if(/[()]/.test(s))throw Error("Write your answer as a sum of products without parentheses, for example x'y + xz.");items=s.split("+").map(t=>L(t))}
 else{items=[];s=s.replace(/[*.]/g,"");const re=/\(([^()]*)\)|([A-Za-z]'?)/y;let pos=0;
  while(pos<s.length){re.lastIndex=pos;const m=re.exec(s);if(!m)throw Error("Write your answer as a product of sums, for example (x+y)(y+z).");pos=re.lastIndex;
   items.push(m[1]!==undefined?m[1].split("+").map(t=>{const a=L(t);if(a.length!=1)throw Error("Inside parentheses, separate literals with +.");return a[0]}):[m[2]])}}
 items.forEach(l=>{const v=l.map(q=>q[0]);if(new Set(v).size!=v.length)throw Error("A term repeats a variable. Simplify that term first.")});return items}
function evalAlt(items,vars,sop,m){const n=vars.length,val=q=>{const b=m>>(n-1-vars.indexOf(q[0]))&1;return q.length>1?1-b:b};return +(sop?items.some(l=>l.every(val)):items.every(l=>l.some(val)))}
function checkAlt(i){const g=gens[i],box=$("r"+i);let items;
 try{items=parseAlt($("a"+i).value,g.vars,g.sop)}catch(e){box.innerHTML=`<div class="err">${esc(e.message)}</div>`;return}
 for(let m=0;m<2**g.n;m++){const v=evalAlt(items,g.vars,g.sop,m);if(v!=g.f[m]){const a=g.vars.map((x,j)=>x+" = "+(m>>(g.n-1-j)&1)).join(", ");box.innerHTML=`<div class="err">✗ Not correct. For ${a} (row ${m}) your answer gives ${v}, but F = ${g.f[m]}. Try again.</div>`;return}}
 const k=KT[g.kind],sop=g.sop,plain=sop?items.map(l=>l.join("")).join(" + "):items.map(l=>"("+l.join("+")+")").join("");
 let fe="";if(g.kind=="nand")fe=ov(items.map(l=>l.length==1?cmp(l[0]):ov(l.join(""))).join(" · "));else if(g.kind=="nor")fe=ov(items.map(l=>l.length==1?cmp(l[0]):ov(l.join("+"))).join(" + "));
 const key=a=>a.map(l=>[...l].sort().join("")).sort().join("|"),same=key(items)==key(g.groups.map(q=>q.lits));
 box.innerHTML=`<div class="okm">✓ Correct! Your answer is equivalent to F.</div><div class="hint">${same?"It is the same as the generated answer.":"It is different from the generated answer, but both give the same truth table."}</div><div class="eq">Your ${sop?"SOP":"POS"}: F = ${esc(plain)}</div>${fe?`<div class="eq">${k.name} form: F = ${fe}</div>`:""}<b>New logic circuit from your answer</b><div class="sc">${circuit({...g,groups:items.map(lits=>({lits}))})}</div>`}
/* ---------- generate ---------- */
function show(msg){$("er").textContent=msg||""}
function gen(){show();const r=getVars();if(r.e)return show(r.e);const vars=r.v,n=vars.length,mode=$("mode").value,kind=$("kind").value,raw=$("val").value.trim(),sop=!!KT[kind].sop;let f=[],given;
 if(mode=="f"){const nums=raw.match(/\d+/g);if(!nums||/[^\d\s,;Σ()mM]/.test(raw))return show("Enter minterm numbers separated by commas, for example: 1, 2, 3, 6, 7.");
  const ms=[...new Set(nums.map(Number))];if(ms.some(x=>x>=2**n))return show(`With ${n} variables the minterms must be between 0 and ${2**n-1}.`);
  f=Array.from({length:2**n},(_,m)=>+ms.includes(m));given=`F(${vars.join(", ")}) = Σ(${ms.sort((a,b)=>a-b).join(", ")})`}
 else{if(!raw)return show("Type a Boolean expression first.");try{const fn=parseExpr(raw,vars);f=Array.from({length:2**n},(_,m)=>{const e={};vars.forEach((v,i)=>e[v]=m>>(n-1-i)&1);return fn(e)?1:0});given=`F(${vars.join(", ")}) = ${esc(raw.replace(/^[^=]*=/,"").trim())}`}catch(x){return show(x.message)}}
 const ones=f.map((v,m)=>v?m:-1).filter(m=>m>=0),zeros=f.map((v,m)=>v?-1:m).filter(m=>m>=0);
 const g={id:++N,n,vars,f,mode,kind,sop,ones,zeros,given,groups:[]};
 if(!ones.length)g.const=0;else if(!zeros.length)g.const=1;
 else{const on=sop?ones:zeros;g.groups=cover(qm(on),on,n).sort((a,b)=>a.cov[0]-b.cov[0]).map(p=>({...p,lits:toLits(p,n,vars,sop)}))}
 if(g.const===undefined){g.sopS=g.sop?g.groups.map(q=>termStr(q.lits,1)).join(" + "):"";g.posS=g.sop?"":g.groups.map(q=>"("+termStr(q.lits,0)+")").join("");
}
 const k=KT[kind];let ex="";
 if(g.const===undefined){const S=(sop?g.sopS:g.posS);let fe;
  if(kind=="nand")fe=ov(g.groups.map(q=>q.lits.length==1?cmp(q.lits[0]):ov(termStr(q.lits,1))).join(" · "));
  else if(kind=="nor")fe=ov(g.groups.map(q=>q.lits.length==1?cmp(q.lits[0]):ov(termStr(q.lits,0))).join(" + "));else fe=S;
  ex=`<div class="eq">Simplified ${sop?"SOP":"POS"}: F = ${S}</div>${kind=="nand"||kind=="nor"?`<div class="eq">${k.name} form: F = ${fe}</div>`:""}`}
 gens.push(g);const i=gens.length-1,tt=g.const!==undefined?`<div class="eq">F = ${g.const} (constant)</div>`:"";
 const d=document.createElement("section");d.className="card";d.id="g"+g.id;
 d.innerHTML=`<div class="top"><h2><span class="badge">#${g.id}</span>${k.name}</h2><button class="s" data-rm="${g.id}">Remove</button></div><div class="given">${given}</div>${tt}${ex}${g.const===undefined?altBox(g,i):""}
 <div class="sec"><div class="sh"><b>K-map</b><button class="s" data-i="${i}" data-w="k">Explain K-map</button></div>${kmap(g)}</div>
 <div class="sec"><div class="sh"><b>Truth table</b><button class="s" data-i="${i}" data-w="t">Explain truth table</button></div><div class="sc">${ttable(g)}</div></div>
 <div class="sec"><div class="sh"><b>Logic circuit: ${k.name}</b><button class="s" data-i="${i}" data-w="c">Explain circuit</button></div><div class="sc">${g.const!==undefined?`<p>F is constant ${g.const}: no gates needed.</p>`:circuit(g)}</div></div>`;
 $("out").appendChild(d);d.scrollIntoView({behavior:"smooth",block:"start"})}
$("go").onclick=gen;$("clr").onclick=()=>{$("out").innerHTML="";gens.length=0;N=0;show()};
$("out").onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.rm){$("g"+b.dataset.rm).remove()}else if(b.dataset.chk!==undefined)checkAlt(+b.dataset.chk);else open(+b.dataset.i,b.dataset.w)};
$("mx").onclick=close;$("out").addEventListener("keydown",e=>{if(e.key=="Enter"&&e.target.dataset.a!==undefined)checkAlt(+e.target.dataset.a)});$("md").onclick=e=>{if(e.target.id=="md")close()};document.addEventListener("keydown",e=>{if(e.key=="Escape")close()});
["vars","mode"].forEach(i=>$(i).addEventListener("input",ui));["val"].forEach(i=>$(i).addEventListener("keydown",e=>{if(e.key=="Enter")gen()}));ui();
</script></main></body></html>
